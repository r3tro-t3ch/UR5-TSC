name: urarm_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  # numerics / plotting
  - numpy>=2.3,<2.4
  - scipy=1.18
  - matplotlib=3.11
  - pip:
      # simulation (MuJoCo scene, viewer) and the arm's shapes for the table check
      - mujoco==3.5.0
      - mujoco-python-viewer==0.1.4
      - glfw==2.10.0
      - PyOpenGL==3.1.10
      # hardware: UR RTDE, Intel RealSense, vision
      - ur_rtde==1.6.5
      - pyrealsense2==2.58.4.10922
      - opencv-python==5.0.0.93
